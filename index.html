<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MLB Runner — Baseball Dino Game</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0c1622; color: #eaf0f6;
    overflow-x: hidden; overflow-y: auto; touch-action: manipulation;
  }
  .wrap {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 12px;
  }
  .title { text-align: center; line-height: 1.1; }
  .title h1 { margin: 0; font-size: clamp(20px, 5vw, 32px); letter-spacing: 0.5px; color: #fff; }
  .title h1 .red { color: #ce1141; }
  .title p { margin: 4px 0 0; font-size: 13px; opacity: 0.6; }

  .stage {
    position: relative;
    /* fit inside the viewport on any screen while keeping the 900:260 ratio */
    width: min(100%, 900px, calc((100dvh - 150px) * 3.46));
    aspect-ratio: 900 / 260;
    background: linear-gradient(#bfe3ff 0%, #e9f6ff 55%, #f4fbff 100%);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.5);
  }
  canvas#game { display: block; width: 100%; height: auto; }

  /* Overlays */
  /* Full-screen modal so the menu is never clipped by the short game box */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(9,16,26,0.92); backdrop-filter: blur(4px);
    color: #fff; text-align: center; padding: 16px;
    overflow-y: auto;
  }
  .overlay.hidden { display: none; }
  /* win bar: let the canvas celebration show through, only buttons clickable */
  .overlay.winbar { background: transparent; backdrop-filter: none; justify-content: flex-end; pointer-events: none; padding-bottom: 18px; }
  .winbtns { display: flex; gap: 10px; pointer-events: auto; }
  .overlay h2 { margin: 0; font-size: clamp(18px, 4vw, 26px); }
  .overlay .sub { font-size: 13px; opacity: 0.8; margin-top: -6px; }

  .difficulty { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rowlbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.55; margin-bottom: -4px; }
  .diffbtn {
    border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.06);
    color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .12s;
  }
  .diffbtn:hover { background: rgba(255,255,255,0.14); }
  .diffbtn.active { background: #ce1141; border-color: #ce1141; }

  .picker { display: flex; align-items: center; gap: 14px; }
  .arrow {
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 20px; line-height: 1;
  }
  .arrow:hover { background: rgba(255,255,255,0.22); }
  .card {
    width: 168px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .card canvas { background: linear-gradient(#dff1ff,#f4fbff); border-radius: 10px; }
  .card .pname { font-weight: 800; font-size: 15px; }
  .card .pteam { font-size: 12px; opacity: 0.75; }

  .actions { display: flex; gap: 10px; margin-top: 2px; flex-wrap: wrap; justify-content: center; }
  .play {
    background: #37b24d; color: #fff; border: none; padding: 11px 26px; border-radius: 999px;
    font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(55,178,77,0.4);
  }
  .play:hover { filter: brightness(1.08); }
  .ghost {
    background: rgba(255,255,255,0.08); color: #fff; border: 1.5px solid rgba(255,255,255,0.25);
    padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .ghost:hover { background: rgba(255,255,255,0.16); }

  .hint { font-size: 12.5px; opacity: 0.6; text-align: center; max-width: 900px; }
  .hint b { opacity: 0.9; }
  kbd { background: #1d2a3a; border: 1px solid #33475f; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: inherit; }

  /* Small / short screens: shrink chrome so the game + menu always fit */
  @media (max-width: 560px), (max-height: 620px) {
    .title p { display: none; }
    .title h1 { font-size: 20px; }
    .overlay h2 { font-size: 17px; }
    .card canvas { width: 108px; height: 92px; }
    .card .pname { font-size: 13px; }
    .diffbtn { padding: 6px 13px; font-size: 13px; }
    .arrow { width: 34px; height: 34px; font-size: 18px; }
    .play, .ghost { padding: 9px 16px; font-size: 14px; }
    .hint { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1>MLB <span class="red">RUNNER</span></h1>
      <p>Jump the baseballs. Duck the fastballs. Endless-runner, baseball style.</p>
    </div>

    <div class="stage">
      <canvas id="game" width="900" height="260"></canvas>

      <!-- START MENU -->
      <div class="overlay" id="menu">
        <h2>⚾ Choose your slugger</h2>
        <div class="rowlbl">Version</div>
        <div class="difficulty" id="ver">
          <button class="diffbtn" data-ver="1">V1 · Classic</button>
          <button class="diffbtn" data-ver="2">V2 · Faces</button>
          <button class="diffbtn" data-ver="3">V3 · Full FX</button>
        </div>
        <div class="rowlbl">Difficulty</div>
        <div class="difficulty" id="diff">
          <button class="diffbtn" data-diff="easy">Easy</button>
          <button class="diffbtn active" data-diff="medium">Medium</button>
          <button class="diffbtn" data-diff="hard">Hard</button>
        </div>
        <div class="picker">
          <button class="arrow" id="prev">‹</button>
          <div class="card">
            <canvas id="preview" width="150" height="128"></canvas>
            <div class="pname" id="pname">—</div>
            <div class="pteam" id="pteam">—</div>
          </div>
          <button class="arrow" id="next">›</button>
        </div>
        <div class="actions">
          <button class="play" id="playBtn">Play Ball ▶</button>
          <button class="ghost" id="surprise">🎲 Surprise Me</button>
        </div>
      </div>

      <!-- WORLD SERIES WIN (transparent bar so the celebration shows) -->
      <div class="overlay winbar hidden" id="win">
        <div class="winbtns">
          <button class="play" id="winAgain">Play Again ▶</button>
          <button class="ghost" id="winMenu">Menu</button>
        </div>
      </div>

      <!-- GAME OVER -->
      <div class="overlay hidden" id="gameover">
        <h2 id="goTitle">Struck out!</h2>
        <div class="sub" id="goScore">Score 0 · High 0</div>
        <div class="actions">
          <button class="play" id="againBtn">Swing Again ▶</button>
          <button class="ghost" id="menuBtn">Change Player / Mode</button>
        </div>
      </div>
    </div>

    <div class="hint">
      <b>Jump:</b> <kbd>Space</kbd> / <kbd>↑</kbd> / tap top &nbsp;·&nbsp;
      <b>Duck:</b> <kbd>↓</kbd> / hold bottom &nbsp;·&nbsp;
      <b>Sound:</b> <kbd>M</kbd>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ======================= ROSTER (12 superstars) =========================
  // Colors + number + helmet mark are drawn — no logo image files.
  // `img` = filename base. Drop img/players/<img>.png to use a real face.
  const ROSTER = [
    { name: "Ronald Acuña Jr.", team: "Braves",    abbr: "ATL", primary: "#13274f", accent: "#ce1141", num: "13", mark: "A",  skin: "#8a5a3b", img: "acuna" },
    { name: "Bryce Harper",     team: "Phillies",  abbr: "PHI", primary: "#e81828", accent: "#284898", num: "3",  mark: "P",  skin: "#c68642", img: "harper" },
    { name: "Shohei Ohtani",    team: "Dodgers",   abbr: "LAD", primary: "#005a9c", accent: "#ef3e42", num: "17", mark: "LA", skin: "#e0ac69", img: "ohtani" },
    { name: "Aaron Judge",      team: "Yankees",   abbr: "NYY", primary: "#0c2340", accent: "#8a97a3", num: "99", mark: "NY", skin: "#8a5a3b", img: "judge" },
    { name: "Mookie Betts",     team: "Dodgers",   abbr: "LAD", primary: "#005a9c", accent: "#ef3e42", num: "50", mark: "LA", skin: "#6f462d", img: "betts" },
    { name: "Mike Trout",       team: "Angels",    abbr: "LAA", primary: "#ba0021", accent: "#003263", num: "27", mark: "A",  skin: "#c68642", img: "trout" },
    { name: "Juan Soto",        team: "Mets",      abbr: "NYM", primary: "#002d72", accent: "#ff5910", num: "22", mark: "NY", skin: "#8a5a3b", img: "soto" },
    { name: "Freddie Freeman",  team: "Dodgers",   abbr: "LAD", primary: "#005a9c", accent: "#ef3e42", num: "5",  mark: "LA", skin: "#d8a373", img: "freeman" },
    { name: "Vladimir Guerrero Jr.", team: "Blue Jays", abbr: "TOR", primary: "#134a8e", accent: "#e8291c", num: "27", mark: "T", skin: "#8a5a3b", img: "vladjr" },
    { name: "Fernando Tatis Jr.", team: "Padres",  abbr: "SD",  primary: "#2f241d", accent: "#ffc425", num: "23", mark: "SD", skin: "#a56c43", img: "tatis" },
    { name: "José Ramírez",     team: "Guardians", abbr: "CLE", primary: "#0c2340", accent: "#e31937", num: "11", mark: "C",  skin: "#8a5a3b", img: "jramirez" },
    { name: "Corey Seager",     team: "Rangers",   abbr: "TEX", primary: "#003278", accent: "#c0111f", num: "5",  mark: "T",  skin: "#c68642", img: "seager" },
    { name: "Tyler • Dude Perfect (secret)", team: "Dude Perfect", abbr: "DP", primary: "#0e76bc", accent: "#ffffff", num: "DP", mark: "DP", skin: "#d8a373", img: "tyler" },
  ];

  // Opponent baseballs (color + abbr, drawn)
  const TEAMS = [
    { abbr: "NYM", color: "#ff5910", ink: "#ffffff", mark: "NY" },
    { abbr: "PHI", color: "#e81828", ink: "#ffffff", mark: "P"  },
    { abbr: "MIA", color: "#00a3e0", ink: "#000000", mark: "M"  },
    { abbr: "WSH", color: "#ab0003", ink: "#ffffff", mark: "W"  },
    { abbr: "LAD", color: "#005a9c", ink: "#ffffff", mark: "LA" },
    { abbr: "HOU", color: "#eb6e1f", ink: "#002d62", mark: "H"  },
    { abbr: "SD",  color: "#2f241d", ink: "#ffc425", mark: "SD" },
    { abbr: "NYY", color: "#0c2340", ink: "#ffffff", mark: "NY" },
    { abbr: "ATL", color: "#ce1141", ink: "#13274f", mark: "A"  },
  ];

  // ======================= OPTIONAL REAL IMAGES ===========================
  // Drop files in img/players/<img>.png and img/logos/<abbr>.png to use them.
  // Missing files fall back to the drawn version automatically.
  const ASSET_VER = "9";  // bump to force phones/browsers to reload images + audio
  function loadImg(src) { const im = new Image(); im.src = src + "?v=" + ASSET_VER; return im; }
  ROSTER.forEach(c => { c.face = loadImg("img/players/" + c.img + ".png"); });
  TEAMS.forEach(t => { t.logo = loadImg("img/logos/" + t.abbr.toLowerCase() + ".png"); });
  function ready(im) { return im && im.complete && im.naturalWidth > 0; }

  // Levels: 6 real ballparks, day -> night, longer & faster each stage.
  // icons = legends that scroll on the outfield wall (rotating themes per team).
  // ground: obstacle types allowed (a NEW one is added each level). air: baseballs?
  const LEVELS = [
    { team: "Braves",   name: "Truist Park",        id: "truist", target: 1200,  sky: ["#8ec5e8", "#e2f2ff"], wall: "#123f2a", trim: "#ce1141", night: false,
      umpColor: "#e01e2b", air: false, ballChance: 0,    ground: ["ump"],
      icons: ["ACUÑA 13", "CHIPPER 10", "MURPHY 3", "MADDUX 31", "SMOLTZ 29"] },
    { team: "Phillies", name: "Citizens Bank Park", id: "cbp",    target: 2800,  sky: ["#a9d6ff", "#eaf4ff"], wall: "#0b5c3b", trim: "#e81828", night: false,
      umpColor: "#7b2ff7", air: true,  ballChance: 0.30, ground: ["ump"],
      icons: ["HARPER 3", "SCHMIDT 20", "UTLEY 26", "ROLLINS 11", "CARLTON 32"] },
    { team: "Dodgers",  name: "Dodger Stadium",     id: "dodger", target: 4800,  sky: ["#ffb45b", "#ffe3b0"], wall: "#1a5aa0", trim: "#ffffff", night: false,
      umpColor: "#ff7a1a", air: true,  ballChance: 0.34, ground: ["ump", "hotdog"],
      icons: ["OHTANI 17", "BETTS 50", "KOUFAX 32", "ROBINSON 42", "KERSHAW 22"] },
    { team: "Rays",     name: "Tropicana Field",    id: "trop",   target: 7200,  sky: ["#12303f", "#1c4a63"], wall: "#0e3a4f", trim: "#8fd400", night: true,
      umpColor: "#ff2d78", air: true,  ballChance: 0.38, ground: ["ump", "hotdog", "crackerjack"],
      icons: ["LONGORIA 3", "KIERMAIER 39", "CRAWFORD 13", "PEÑA 22", "FRANCO 5"] },
    { team: "Red Sox",  name: "Fenway Park",        id: "fenway", target: 10000, sky: ["#2a3a63", "#5a6ea0"], wall: "#1f7a3d", trim: "#bd3039", night: true,
      umpColor: "#12d0e0", air: true,  ballChance: 0.42, ground: ["ump", "hotdog", "crackerjack", "soda"],
      icons: ["ORTIZ 34", "WILLIAMS 9", "YAZ 8", "PEDROIA 15", "MARTINEZ 45"] },
    { team: "Yankees",  name: "Yankee Stadium",     id: "yankee", target: 13500, sky: ["#0b1430", "#1b2c58"], wall: "#0c2340", trim: "#ffffff", night: true,
      umpColor: "#ffd21a", air: true,  ballChance: 0.46, ground: ["ump", "hotdog", "crackerjack", "soda", "seeds", "gum"],
      icons: ["JUDGE 99", "RUTH 3", "JETER 2", "MANTLE 7", "GEHRIG 4"] },
  ];
  // Optional real stadium photos: drop stadiums/<id>.jpg to use as that level's backdrop.
  LEVELS.forEach(L => { L.bg = loadImg("stadiums/" + L.id + ".jpg"); });

  // ======================= DIFFICULTY =====================================
  const DIFFS = {
    easy:   { startSpeed: 5.0, maxSpeed: 9.5,  accel: 0.0009, reactFrames: 48, gapExtra: 320, flyStart: 500, flyChance: 0.12 },
    medium: { startSpeed: 6.0, maxSpeed: 12.5, accel: 0.0015, reactFrames: 41, gapExtra: 260, flyStart: 280, flyChance: 0.20 },
    hard:   { startSpeed: 7.3, maxSpeed: 15.5, accel: 0.0022, reactFrames: 34, gapExtra: 210, flyStart: 130, flyChance: 0.30 },
  };

  // ======================= CANVAS SETUP ===================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = 900, H = 260, GROUND_Y = 214;
  function fitDPR() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitDPR(); window.addEventListener("resize", fitDPR);

  // ======================= SOUND ==========================================
  // All synthesized in-browser (WebAudio) + browser speech — no audio files.
  let audioCtx = null, muted = false, crowdGain = null, crowdSrc = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur = 0.08, type = "square", vol = 0.05) {
    if (muted) return; ensureAudio(); if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o.start(t); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.stop(t + dur);
  }
  function noiseBuffer(sec) {
    const b = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * sec), audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  const CROWD_BASE = 0.038;

  // ---- Optional REAL audio files: drop clips into audio/ and they play ----
  // audio/crowd.mp3 (loop), audio/hit.mp3, audio/cheer.mp3, audio/playball.mp3, audio/out.mp3
  // Missing files fall back to the light synth below (no robotic voice).
  function makeSfx(file, loop, vol) {
    const a = new Audio("audio/" + file + "?v=" + ASSET_VER);
    a.preload = "auto"; a.loop = !!loop; a.volume = vol == null ? 0.7 : vol; a._ok = false;
    a.addEventListener("canplaythrough", () => { a._ok = true; });
    a.addEventListener("error", () => { a._ok = false; });
    return a;
  }
  const SFX = {
    playball: makeSfx("playball.mp3", false, 0.9),
    crowd:    makeSfx("crowd.mp3",    true,  0.5),
    hit:      makeSfx("hit.mp3",      false, 0.85),
    cheer:    makeSfx("cheer.mp3",    false, 0.85),
    out:      makeSfx("out.mp3",      false, 0.85),
    win:      makeSfx("win.mp3",      true,  0.7),
  };
  function playFile(a) { if (muted || !a || !a._ok) return false; try { a.currentTime = 0; a.play(); return true; } catch (e) { return false; } }
  function startBall() { playFile(SFX.playball); }
  let crowdFile = false;

  function startCrowd() {
    ensureAudio();
    if (SFX.crowd._ok) { crowdFile = true; SFX.crowd.volume = muted ? 0 : 0.5; try { SFX.crowd.currentTime = 0; SFX.crowd.play(); } catch (e) {} return; }
    if (!audioCtx) return; stopSynthCrowd();
    crowdSrc = audioCtx.createBufferSource(); crowdSrc.buffer = noiseBuffer(2.2); crowdSrc.loop = true;
    const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 720;
    crowdGain = audioCtx.createGain(); crowdGain.gain.value = muted ? 0 : CROWD_BASE;
    crowdSrc.connect(f); f.connect(crowdGain); crowdGain.connect(audioCtx.destination);
    crowdSrc.start();
  }
  function stopSynthCrowd() { if (crowdSrc) { try { crowdSrc.stop(); } catch (e) {} crowdSrc.disconnect(); crowdSrc = null; } }
  function stopCrowd() { if (crowdFile) { try { SFX.crowd.pause(); } catch (e) {} crowdFile = false; } stopSynthCrowd(); }

  function cheer() {
    if (muted) return;
    if (playFile(SFX.cheer)) return;
    if (!audioCtx || !crowdGain) return;
    const t = audioCtx.currentTime, g = crowdGain.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.16, t + 0.12); g.linearRampToValueAtTime(CROWD_BASE, t + 1.7);
  }
  function groan() {
    if (muted) return;
    if (crowdGain && audioCtx) { const t = audioCtx.currentTime, g = crowdGain.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.006, t + 0.7); }
    if (playFile(SFX.out)) return;
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.6);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.62);
  }
  function fanfare() {
    if (muted) return;
    if (playFile(SFX.win)) return;             // real music file if provided
    ensureAudio(); if (!audioCtx) return;      // else a cheerful synth fanfare
    const notes = [523, 659, 784, 1047, 880, 1047, 1319];
    const t0 = audioCtx.currentTime;
    notes.forEach((f, i) => {
      const t = t0 + i * 0.15;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.22);
    });
  }
  function stopWinMusic() { if (SFX.win._ok) { try { SFX.win.pause(); } catch (e) {} } }
  function crack() {
    if (muted) return;
    if (playFile(SFX.hit)) return;
    ensureAudio(); if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer(0.05);
    const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.9;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start(t); src.stop(t + 0.09);
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(230, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.09);
    og.gain.setValueAtTime(0.28, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og); og.connect(audioCtx.destination); o.start(t); o.stop(t + 0.11);
  }

  // ======================= STATE ==========================================
  const S = { MENU: 0, PLAYING: 1, OVER: 2, WIN: 3 };
  let state = S.MENU;
  let winTimer = 0, confetti = [];

  let charIndex = Number(localStorage.getItem("mlbChar") || 0);
  if (charIndex < 0 || charIndex >= ROSTER.length) charIndex = 0;
  let diffKey = localStorage.getItem("mlbDiff") || "medium";
  if (!DIFFS[diffKey]) diffKey = "medium";

  let version = Number(localStorage.getItem("mlbVer") || 1);   // 1=classic, 2=faces, 3=full FX
  if (![1, 2, 3].includes(version)) version = 1;
  const richSound = () => version === 3;
  function useImg(im) { return version >= 2 && ready(im); }

  const GRAVITY = 0.62, JUMP_V = -10.8;
  const player = { x: 92, y: GROUND_Y, vy: 0, ducking: false, onGround: true, runFrame: 0 };
  let jumpHeld = false, jumpHoldFrames = 0;          // hold jump = float higher (clear 2)
  let celebrating = false, celebrateTimer = 0;        // brief between-level celebration
  // team badges for the big inning-style header
  const BADGE = { Braves: ["#13274f", "A"], Phillies: ["#e81828", "P"], Dodgers: ["#005a9c", "LA"], Rays: ["#092c5c", "TB"], "Red Sox": ["#bd3039", "B"], Yankees: ["#0c2340", "NY"] };
  const ORD = ["1ST", "2ND", "3RD", "4TH", "5TH", "6TH"];

  let cfg = DIFFS[diffKey];
  let speed = cfg.startSpeed;
  let distance = 0, score = 0;
  let high = Number(localStorage.getItem("mlbHigh") || 0);
  let obstacles = [], clouds = [];
  let spawnGap = 0, groundOffset = 0, flashMilestone = 0;
  let oppTeams = TEAMS;
  let levelIdx = 0, champShown = false, levelFlash = 0, levelFlashName = "";
  let stars = [];
  function makeStars() { stars = []; for (let i = 0; i < 42; i++) stars.push({ x: Math.random() * W, y: Math.random() * (GROUND_Y - 34), a: 0.3 + Math.random() * 0.6 }); }
  function effMax() { return cfg.maxSpeed + levelIdx * 1.0; }
  makeStars();

  for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: 24 + Math.random() * 70, s: 0.3 + Math.random() * 0.4 });

  function startGame() {
    cfg = DIFFS[diffKey];
    state = S.PLAYING;
    speed = cfg.startSpeed;
    distance = 0; score = 0;
    obstacles = []; flashMilestone = 0;
    player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.ducking = false;
    spawnGap = 520;
    const me = ROSTER[charIndex];
    oppTeams = TEAMS.filter(t => t.abbr !== me.abbr);
    if (oppTeams.length === 0) oppTeams = TEAMS;
    levelIdx = 0; champShown = false; levelFlash = 0; makeStars();
    stopWinMusic();
    menuEl.classList.add("hidden"); gameoverEl.classList.add("hidden"); winEl.classList.add("hidden");
    if (richSound()) { ensureAudio(); startCrowd(); startBall(); }
    else beep(660, 0.1, "square", 0.05);
  }

  function onLevelUp() {
    levelFlash = 100; levelFlashName = LEVELS[levelIdx].team + " · " + LEVELS[levelIdx].name;
    speed = Math.min(effMax(), speed + 0.6); makeStars();
    obstacles = []; spawnGap = 300;                 // fresh slate for the new inning
    celebrating = true; celebrateTimer = 52;         // brief crowd-roar celebration
    if (richSound()) cheer(); else beep(900, 0.14, "sine", 0.06);
  }
  function makeConfetti() {
    confetti = [];
    const cols = ["#ce1141", "#13274f", "#ffd23f", "#ffffff", "#2e8b57", "#ff5910", "#e81828"];
    for (let i = 0; i < 140; i++) confetti.push({
      x: Math.random() * W, y: -Math.random() * H,
      vx: (Math.random() - 0.5) * 2, vy: 1.5 + Math.random() * 2.5,
      s: 3 + Math.random() * 4, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
      c: cols[(Math.random() * cols.length) | 0],
    });
  }
  function onChamp() {
    champShown = true;
    state = S.WIN; winTimer = 0; makeConfetti();
    if (score > high) { high = score; localStorage.setItem("mlbHigh", String(high)); }
    if (richSound()) { cheer(); fanfare(); } else { fanfare(); }
    winEl.classList.remove("hidden");
  }

  // ======================= SPAWNING =======================================
  function nextGap() {
    const minGap = speed * cfg.reactFrames;      // must-clear reaction distance
    return minGap + Math.random() * cfg.gapExtra;
  }
  function spawnObstacle() {
    const L = LEVELS[levelIdx];
    // AIR: baseballs (rival team names) in bursts — hold SLIDE to clear a row
    if (L.air && Math.random() < L.ballChance) {
      const n = 1 + ((Math.random() * (levelIdx >= 3 ? 3 : 2)) | 0);
      let gx = W + 20;
      for (let i = 0; i < n; i++) {
        const amp = Math.random() < 0.35 ? 7 + Math.random() * 7 : 0;
        const team = oppTeams[(Math.random() * oppTeams.length) | 0];
        obstacles.push({ type: "ball", x: gx, w: 22, h: 22, baseY: GROUND_Y - 30, bob: Math.random() * 6.28, bobY: 0, amp, team });
        gx += 34 + Math.random() * 16;
      }
      spawnGap = nextGap();
      return;
    }
    // GROUND: ump or food, uniform size. Occasional pair — hold JUMP to clear both.
    const g = L.ground;
    const pushGround = (x) => obstacles.push({ type: g[(Math.random() * g.length) | 0], x, w: 26, h: 36, baseY: GROUND_Y, bobY: 0 });
    if (levelIdx >= 2 && Math.random() < 0.22) { pushGround(W + 20); pushGround(W + 84); }
    else pushGround(W + 20);
    spawnGap = nextGap();
  }

  // ======================= INPUT ==========================================
  function jump() {
    if (state !== S.PLAYING || celebrating) return;
    if (player.onGround) { player.vy = JUMP_V; player.onGround = false; player.ducking = false; jumpHeld = true; jumpHoldFrames = 0; if (richSound()) crack(); else beep(520, 0.09, "square", 0.045); }
  }
  function setDuck(on) {
    if (state !== S.PLAYING) return;
    if (on) { if (player.onGround) player.ducking = true; else player.vy += 1.6; }
    else player.ducking = false;
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyM") { muted = !muted; if (crowdGain) crowdGain.gain.value = muted ? 0 : CROWD_BASE; if (crowdFile) SFX.crowd.volume = muted ? 0 : 0.5; return; }
    if (state === S.MENU) {
      if (e.code === "ArrowLeft") { changeChar(-1); }
      else if (e.code === "ArrowRight") { changeChar(1); }
      else if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); startGame(); }
      return;
    }
    if (state === S.OVER || state === S.WIN) {
      if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); startGame(); }
      else if (e.code === "Escape") { toMenu(); }
      return;
    }
    // playing
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); jump(); }
    else if (e.code === "ArrowDown" || e.code === "KeyS") { e.preventDefault(); setDuck(true); }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowDown" || e.code === "KeyS") setDuck(false);
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { jumpHeld = false; if (player.vy < -4.5) player.vy = -4.5; } // release = short hop
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (state !== S.PLAYING) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const ry = (e.clientY - rect.top) / rect.height;
    if (ry > 0.62) setDuck(true); else jump();   // holding either keeps it (long jump / long slide)
  });
  canvas.addEventListener("pointerup", () => { setDuck(false); jumpHeld = false; if (player.vy < -4.5) player.vy = -4.5; });
  canvas.addEventListener("pointercancel", () => { setDuck(false); jumpHeld = false; });

  // ======================= DRAW: baseball =================================
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function drawBaseball(g, x, y, r, team) {
    g.save();
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    g.fillStyle = "#fdfdfd"; g.fill();
    g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,0.18)"; g.stroke();
    if (useImg(team.logo)) {
      // real logo file, clipped to the ball
      g.save(); g.beginPath(); g.arc(x, y, r - 1, 0, Math.PI * 2); g.clip();
      const s = (r - 1) * 2; g.drawImage(team.logo, x - (r - 1), y - (r - 1), s, s);
      g.restore();
    } else {
      // red stitches (keeps the baseball look)
      g.strokeStyle = "rgba(214,51,51,0.55)"; g.lineWidth = 1.4;
      g.beginPath(); g.arc(x - r * 0.62, y, r * 1.08, -0.6, 0.6); g.stroke();
      g.beginPath(); g.arc(x + r * 0.62, y, r * 1.08, Math.PI - 0.6, Math.PI + 0.6); g.stroke();
      if (version >= 2) {
        // team roundel emblem stamped on the ball (V2/V3). V1 stays a plain baseball.
        const er = r * 0.72;
        g.beginPath(); g.arc(x, y, er, 0, Math.PI * 2);
        g.fillStyle = team.color; g.fill();
        g.lineWidth = 1.6; g.strokeStyle = "rgba(255,255,255,0.92)"; g.stroke();
        g.fillStyle = team.ink;
        const fs = Math.round(team.mark.length > 1 ? er * 0.92 : er * 1.28);
        g.font = "bold " + fs + "px Arial"; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(team.mark, x, y + 0.5);
      }
    }
    g.restore();
  }

  // ======================= DRAW: obstacles (the bad guys) =================
  function drawObstacle(o) {
    const oy = o.bobY || 0;
    // ground shadow (grounds the sprite + adds pop)
    if (o.type !== "ball") {
      ctx.save(); ctx.fillStyle = "rgba(0,0,0,0.20)";
      ctx.beginPath(); ctx.ellipse(o.x, GROUND_Y + 2, o.w * 0.5, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (o.type === "ball") drawTeamBall(o.x, o.baseY - o.h / 2 + oy, o.w / 2, o.team);
    else if (o.type === "ump") drawUmpire(o.x, o.baseY + oy, o.w, o.h, LEVELS[levelIdx].umpColor);
    else drawFood(o.type, o.x, o.baseY + oy, o.w, o.h);
  }

  function drawTeamBall(cx, cy, r, team) {
    const g = ctx; g.save();
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = "#fdfdfd"; g.fill();
    g.lineWidth = 1.4; g.strokeStyle = "rgba(0,0,0,0.35)"; g.stroke();
    g.strokeStyle = "#d33"; g.lineWidth = 1.4;
    g.beginPath(); g.arc(cx - r * 0.62, cy, r * 1.06, -0.6, 0.6); g.stroke();
    g.beginPath(); g.arc(cx + r * 0.62, cy, r * 1.06, Math.PI - 0.6, Math.PI + 0.6); g.stroke();
    if (team) { g.fillStyle = team.color; g.font = "bold 8px Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(team.abbr, cx, cy + 0.5); }
    g.restore();
  }

  // Umpire in the level's bright color + bold black outline so it never blends
  function drawUmpire(cx, baseY, w, h, color) {
    const g = ctx; g.save(); g.translate(cx, baseY);
    const hw = w / 2;
    g.lineJoin = "round";
    // legs + shoes (dark, outlined)
    g.fillStyle = "#20242c"; g.strokeStyle = "#000"; g.lineWidth = 1.5;
    g.fillRect(-hw * 0.55, -h * 0.34, w * 0.24, h * 0.34); g.strokeRect(-hw * 0.55, -h * 0.34, w * 0.24, h * 0.34);
    g.fillRect(hw * 0.10, -h * 0.34, w * 0.24, h * 0.34); g.strokeRect(hw * 0.10, -h * 0.34, w * 0.24, h * 0.34);
    g.fillStyle = "#0c0c0c"; g.fillRect(-hw * 0.62, -h * 0.05, w * 0.32, h * 0.06); g.fillRect(hw * 0.02, -h * 0.05, w * 0.32, h * 0.06);
    // arms in team color
    g.fillStyle = color;
    g.fillRect(-hw * 0.98, -h * 0.72, w * 0.16, h * 0.30); g.strokeRect(-hw * 0.98, -h * 0.72, w * 0.16, h * 0.30);
    g.fillRect(hw * 0.82, -h * 0.72, w * 0.16, h * 0.30); g.strokeRect(hw * 0.82, -h * 0.72, w * 0.16, h * 0.30);
    // body (bright uniform) + chest protector, thick outline
    g.fillStyle = color; g.lineWidth = 2;
    roundRect(g, -hw * 0.9, -h * 0.78, w * 0.9, h * 0.48, w * 0.16); g.fill(); g.stroke();
    g.fillStyle = "rgba(255,255,255,0.85)"; roundRect(g, -hw * 0.66, -h * 0.72, w * 0.66, h * 0.36, w * 0.1); g.fill();
    g.strokeStyle = color; g.lineWidth = 1.4;
    for (let i = 1; i <= 2; i++) { const yy = -h * 0.72 + i * h * 0.12; g.beginPath(); g.moveTo(-hw * 0.66, yy); g.lineTo(-hw * 0.66 + w * 0.66, yy); g.stroke(); }
    // head: skin + dark cap + white mask cage, outlined
    const hy = -h * 0.82, hr = h * 0.15;
    g.strokeStyle = "#000"; g.lineWidth = 1.5;
    g.fillStyle = "#8a5a3b"; g.beginPath(); g.arc(0, hy, hr, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = "#111"; g.beginPath(); g.arc(0, hy, hr * 1.16, Math.PI, Math.PI * 2); g.closePath(); g.fill();
    g.strokeStyle = "#e8ebf0"; g.lineWidth = 1.3;
    g.beginPath(); g.arc(0, hy + h * 0.02, hr, -0.4, Math.PI + 0.4); g.stroke();
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * hr * 0.5, hy - hr * 0.7); g.lineTo(i * hr * 0.5, hy + hr * 0.95); g.stroke(); }
    g.restore();
  }

  // Ballpark food obstacles (jump these). All share the uniform ground box.
  function drawFood(type, cx, baseY, w, h) {
    const g = ctx; g.save(); g.translate(cx, baseY);
    g.lineJoin = "round"; g.strokeStyle = "#000"; g.lineWidth = 1.5; g.textAlign = "center"; g.textBaseline = "middle";
    const outR = (x, y, ww, hh, r) => { roundRect(g, x, y, ww, hh, r); g.fill(); g.stroke(); };
    if (type === "hotdog") {
      g.fillStyle = "#f2c25a"; outR(-15, -22, 30, 16, 7);           // bun
      g.fillStyle = "#a5432a"; outR(-18, -17, 36, 7, 4);            // sausage
      g.strokeStyle = "#ffd21a"; g.lineWidth = 2; g.beginPath();     // mustard
      for (let x = -15; x <= 15; x += 5) g.lineTo(x, -13.5 + (x % 10 ? 2 : -2)); g.stroke();
    } else if (type === "crackerjack") {
      g.fillStyle = "#e2231a"; outR(-11, -30, 22, 30, 3);          // red box
      g.fillStyle = "#fff"; g.fillRect(-11, -20, 22, 8);
      g.fillStyle = "#e2231a"; g.font = "bold 7px Arial"; g.fillText("CJ", 0, -16);
      g.fillStyle = "#1a3d8f"; g.font = "bold 6px Arial"; g.fillText("★", 0, -25);
    } else if (type === "soda") {
      g.fillStyle = "#d11a2a"; g.beginPath(); g.moveTo(-10, -28); g.lineTo(10, -28); g.lineTo(7, 0); g.lineTo(-7, 0); g.closePath(); g.fill(); g.stroke(); // cup
      g.fillStyle = "#fff"; g.fillRect(-10, -22, 20, 6);
      g.fillStyle = "#bcdcff"; g.fillRect(-11, -32, 22, 4); g.strokeRect(-11, -32, 22, 4); // lid
      g.strokeStyle = "#e33"; g.lineWidth = 2; g.beginPath(); g.moveTo(6, -34); g.lineTo(10, -20); g.stroke(); // straw
    } else if (type === "seeds") {
      g.fillStyle = "#1f9d55"; outR(-11, -30, 22, 30, 4);          // bag
      g.fillStyle = "#fff"; g.font = "bold 6px Arial"; g.fillText("SUN", 0, -20); g.fillText("SEEDS", 0, -12);
    } else if (type === "gum") {
      g.fillStyle = "#ff5fa2"; outR(-14, -18, 28, 14, 3);          // gum pack
      g.fillStyle = "#fff"; g.fillRect(-14, -13, 28, 3);
      g.fillStyle = "#2b6cff"; g.font = "bold 6px Arial"; g.fillText("GUM", 0, -11);
    } else {
      g.fillStyle = "#888"; outR(-10, -24, 20, 24, 4);
    }
    g.restore();
  }

  // ======================= DRAW: runner ===================================
  const PANTS = "#eceff3";
  function drawRunner(g, cx, feet, ch, st) {
    g.save(); g.translate(cx, feet);

    if (st.duck) { drawDuck(g, ch); g.restore(); return; }

    const air = !st.onGround;

    // ---- ONLY THE LEGS ANIMATE. Torso, arms, head stay steady. ----
    let backA, frontA;
    if (air) { backA = 0.55; frontA = -0.42; }          // tucked while jumping
    else { const s = Math.sin(st.runFrame) * 0.5; backA = s; frontA = -s; }
    drawLeg(g, -1, backA, ch, true);
    drawLeg(g, 7, frontA, ch, false);

    // torso (steady)
    g.fillStyle = "#f6f6f4"; roundRect(g, -11, -44, 24, 26, 6); g.fill();
    g.fillStyle = ch.accent; g.fillRect(-11, -30, 24, 3);
    g.strokeStyle = "rgba(20,30,55,0.16)"; g.lineWidth = 1;
    for (let i = -8; i <= 10; i += 4) { g.beginPath(); g.moveTo(i, -43); g.lineTo(i, -19); g.stroke(); }
    g.fillStyle = ch.primary; g.font = "bold 11px Arial"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(ch.num, 1, -31);

    // arms — fixed running pose, no swing
    if (st.party || st.cheer) { drawArm(g, -8, -42, -2.5, ch); drawArm(g, 10, -42, 2.5, ch); }
    else { drawArm(g, -6, -40, -0.5, ch); drawArm(g, 9, -40, 0.55, ch); }

    drawHead(g, 2, -49, 0, ch, st.party);
    g.restore();
  }

  function drawDuck(g, ch) {
    g.save(); g.translate(0, -2);
    // two bent legs tucked under
    g.fillStyle = PANTS; g.fillRect(-12, -13, 9, 13); g.fillRect(3, -13, 9, 13);
    g.fillStyle = ch.primary; g.fillRect(-12, -4, 9, 5); g.fillRect(3, -4, 9, 5);   // socks
    g.fillStyle = "#111"; g.fillRect(-13, 0, 11, 4); g.fillRect(2, 0, 11, 4);       // cleats
    // crouched torso
    g.fillStyle = "#f6f6f4"; roundRect(g, -13, -32, 26, 20, 7); g.fill();
    g.fillStyle = ch.accent; g.fillRect(-13, -23, 26, 3);
    g.fillStyle = ch.primary; g.font = "bold 10px Arial"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(ch.num, 0, -21);
    drawArm(g, 9, -28, 1.0, ch);   // one arm reaching forward
    drawHead(g, 6, -19, 0.05, ch);
    g.restore();
  }

  function drawLeg(g, hipX, angle, ch, back) {
    g.save(); g.translate(hipX, -18); g.rotate(angle);
    g.fillStyle = PANTS; g.fillRect(-4, 0, 8, 12);
    g.fillStyle = ch.primary; if (back) g.globalAlpha = 0.82; g.fillRect(-3.5, 11, 7, 8); g.globalAlpha = 1;
    g.fillStyle = "#111"; g.fillRect(-4, 18, 11, 4);
    g.restore();
  }
  function drawArm(g, shX, shY, angle, ch) {
    g.save(); g.translate(shX, shY + 4); g.rotate(angle);
    g.fillStyle = "#f6f6f4"; g.fillRect(-3, 0, 6, 8);
    g.fillStyle = ch.skin; g.fillRect(-3, 7, 6, 8);
    g.restore();
  }
  function drawHead(g, cx, cy, tilt, ch, party) {
    g.save(); g.translate(cx, cy); g.rotate(tilt);
    const R = 14;  // big "bobblehead" size so the face reads clearly
    if (useImg(ch.face)) {
      // real face, zoomed in and circle-clipped for a big-head look
      g.save(); g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.clip();
      const s = R * 2.15; g.drawImage(ch.face, -s / 2, -s / 2, s, s); g.restore();
      g.lineWidth = 1.5; g.strokeStyle = "rgba(0,0,0,0.22)"; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.stroke();
    } else {
      // clean cartoon face, scaled up
      g.fillStyle = ch.skin; g.beginPath(); g.arc(0, 1, R, 0, Math.PI * 2); g.fill();
      g.fillStyle = ch.primary; g.beginPath(); g.arc(0, 0, R + 0.5, Math.PI, Math.PI * 2); g.closePath(); g.fill();
      g.fillStyle = ch.accent; g.fillRect(6, -1, 15, 4.5);
      g.fillStyle = "#fff"; g.font = "bold 9px Arial"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(ch.mark, -1, -5);
      g.fillStyle = "#111"; g.fillRect(4.5, 1.5, 2.6, 2.6);
      g.strokeStyle = "#3a2417"; g.lineWidth = 1.2;
      g.beginPath(); g.arc(5, 6, 3.2, 0.1, Math.PI - 0.3); g.stroke();
    }
    if (party) {
      // "deal with it" pixel shades
      g.fillStyle = "#111";
      g.fillRect(-R * 0.92, -3, R * 0.82, R * 0.5);
      g.fillRect(R * 0.10, -3, R * 0.82, R * 0.5);
      g.fillRect(-R * 0.1, -2, R * 0.2, 3);
      // big open meme mouth
      g.fillStyle = "#5a1010";
      g.beginPath(); g.ellipse(0, R * 0.62, R * 0.34, R * 0.3, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fff"; g.fillRect(-R * 0.26, R * 0.44, R * 0.52, 2);
    }
    g.restore();
  }

  // ======================= DRAW: scenery / hud ============================
  function drawGround(off) {
    ctx.fillStyle = "#4b8b3b"; ctx.fillRect(0, GROUND_Y, W, 6);
    ctx.fillStyle = "#3d7531"; ctx.fillRect(0, GROUND_Y + 6, W, H - GROUND_Y - 6);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let i = 0; i < W + 40; i += 34) {
      const x = ((i - (off % 34)) + W) % (W + 34);
      ctx.fillRect(x, GROUND_Y + 10, 8, 2); ctx.fillRect(x + 16, GROUND_Y + 20, 5, 2);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 1); ctx.lineTo(W, GROUND_Y + 1); ctx.stroke();
  }
  function drawClouds() {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
      ctx.arc(c.x + 12, c.y + 3, 13, 0, Math.PI * 2);
      ctx.arc(c.x + 26, c.y, 9, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawSky() {
    const L = LEVELS[levelIdx];
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 46);
    g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND_Y + 46);
    if (L.night) {
      ctx.fillStyle = "#fff";
      for (const s of stars) { ctx.globalAlpha = s.a; ctx.fillRect(s.x, s.y, 2, 2); }
      ctx.globalAlpha = 1;
      for (const x of [130, 770]) {
        const gg = ctx.createRadialGradient(x, 18, 4, x, 18, 82);
        gg.addColorStop(0, "rgba(255,255,210,0.33)"); gg.addColorStop(1, "rgba(255,255,210,0)");
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, 18, 82, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#20304a"; ctx.fillRect(x - 3, 20, 6, 72);
        ctx.fillStyle = "#fffbe0"; roundRect(ctx, x - 20, 8, 40, 16, 4); ctx.fill();
      }
    }
  }

  // ---- Ballpark backdrop (stands + landmark + outfield wall + legends) ----
  function hexToRgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; }
  function shade(hex, f) { const c = hexToRgb(hex); return "rgb(" + Math.round(c.r * f) + "," + Math.round(c.g * f) + "," + Math.round(c.b * f) + ")"; }
  function tri(x, baseY, w, h) { ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x + w / 2, baseY - h); ctx.lineTo(x + w, baseY); ctx.closePath(); ctx.fill(); }

  function coverDraw(img, dx, dy, dw, dh) {
    const iw = img.naturalWidth, ih = img.naturalHeight; if (!iw) return;
    const s = Math.max(dw / iw, dh / ih), w = iw * s, h = ih * s;
    ctx.save(); ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
    ctx.drawImage(img, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h); ctx.restore();
  }
  function drawPark() {
    const L = LEVELS[levelIdx];
    // real stadium photo backdrop if provided
    if (ready(L.bg)) {
      coverDraw(L.bg, 0, 0, W, GROUND_Y);
      const gr = ctx.createLinearGradient(0, GROUND_Y - 74, 0, GROUND_Y);
      gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.30)");
      ctx.fillStyle = gr; ctx.fillRect(0, GROUND_Y - 74, W, 74);
      return;
    }
    // grandstand band
    ctx.fillStyle = shade(L.wall, L.night ? 0.55 : 0.85);
    ctx.fillRect(0, 96, W, 60);
    // distant crowd speckle (static pattern, no flicker)
    ctx.fillStyle = L.night ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.16)";
    for (let i = 6; i < W; i += 9) { const yy = 102 + ((i * 7) % 44); ctx.fillRect(i, yy, 3, 3); }
    drawLandmark(L);
    // outfield wall
    ctx.fillStyle = L.wall; ctx.fillRect(0, 150, W, GROUND_Y - 150);
    ctx.fillStyle = L.trim; ctx.fillRect(0, 150, W, 4);
    ctx.fillStyle = "#f6c000"; ctx.fillRect(0, 154, W, 2); // home-run yellow line
    // scrolling legend placards along the wall (rotating "iconic players")
    const sp = 300, off = groundOffset % sp, base = Math.floor(groundOffset / sp);
    for (let k = -1; k <= Math.ceil(W / sp) + 1; k++) {
      const x = k * sp - off + 60;
      const idx = ((base + k) % L.icons.length + L.icons.length) % L.icons.length;
      ctx.fillStyle = "rgba(255,255,255,0.92)"; roundRect(ctx, x - 48, 162, 96, 24, 4); ctx.fill();
      ctx.fillStyle = L.trim; ctx.fillRect(x - 48, 162, 96, 3);
      ctx.fillStyle = shade(L.wall, 0.9); ctx.font = "bold 12px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(L.icons[idx], x, 175);
    }
  }

  function drawLandmark(L) {
    const c = ctx;
    switch (L.id) {
      case "truist": // Georgia pines + scoreboard
        c.fillStyle = "#1f5e3a";
        for (let x = -10; x < W; x += 52) tri(x, 100, 24, 42);
        c.fillStyle = "#0a0a0a"; roundRect(c, W * 0.60, 58, 168, 40, 4); c.fill();
        c.fillStyle = "#123f2a"; c.fillRect(W * 0.60 + 6, 64, 156, 28);
        c.fillStyle = "#ffcf33"; c.font = "bold 12px Arial"; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("BRAVES 4   GUESTS 1", W * 0.60 + 84, 78);
        break;
      case "cbp": { // Liberty Bell
        const bx = W * 0.74, by = 60;
        c.fillStyle = "#ffd23f";
        c.beginPath(); c.moveTo(bx - 26, by); c.quadraticCurveTo(bx - 30, by + 34, bx - 20, by + 40);
        c.lineTo(bx + 20, by + 40); c.quadraticCurveTo(bx + 30, by + 34, bx + 26, by); c.closePath(); c.fill();
        c.fillStyle = "#b8860b"; c.fillRect(bx - 30, by - 6, 60, 8);
        c.fillStyle = "#8b5a00"; c.fillRect(bx - 5, by + 40, 10, 8);
        break;
      }
      case "dodger": // mountains + zigzag pavilion + palms
        c.fillStyle = "#8f83b5";
        c.beginPath(); c.moveTo(0, 96); c.lineTo(140, 52); c.lineTo(300, 90); c.lineTo(480, 54); c.lineTo(680, 92); c.lineTo(860, 60); c.lineTo(W, 96); c.closePath(); c.fill();
        c.strokeStyle = "#efe7c8"; c.lineWidth = 4; c.beginPath();
        for (let x = 0; x <= W; x += 44) { c.lineTo(x, 96); c.lineTo(x + 22, 86); } c.stroke();
        for (const px of [70, W - 84]) { c.fillStyle = "#3a2a12"; c.fillRect(px - 2, 70, 4, 28); c.fillStyle = "#2e8b57"; for (let a = -2; a <= 2; a++) { c.save(); c.translate(px, 70); c.rotate(a * 0.5); c.fillRect(0, -2, 16, 4); c.restore(); } }
        break;
      case "trop": // dome + catwalks
        c.strokeStyle = "rgba(255,255,255,0.16)"; c.lineWidth = 3;
        c.beginPath(); c.ellipse(W / 2, 150, W * 0.6, 120, 0, Math.PI, 0); c.stroke();
        c.lineWidth = 2;
        for (let i = 1; i < 6; i++) { c.beginPath(); c.moveTo((W / 6) * i, 96); c.lineTo(W / 2, 44); c.stroke(); }
        break;
      case "fenway": { // Green Monster + CITGO
        c.fillStyle = "#1f7a3d"; c.fillRect(0, 66, 148, GROUND_Y - 66);
        c.fillStyle = "#0f5a2a"; c.fillRect(0, 66, 148, 4);
        c.fillStyle = "#0a0a0a"; for (let i = 0; i < 5; i++) c.fillRect(12 + i * 27, 118, 20, 26);
        c.fillStyle = "#e03a3a"; roundRect(c, W - 122, 52, 62, 30, 6); c.fill();
        c.fillStyle = "#fff"; c.font = "bold 12px Arial"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("CITGO", W - 91, 67);
        break;
      }
      case "yankee": // white facade frieze
        c.fillStyle = "#f4f4f0"; c.beginPath();
        for (let x = 0; x <= W; x += 26) { c.lineTo(x, 94); c.lineTo(x + 13, 82); }
        c.lineTo(W, 94); c.lineTo(W, 100); c.lineTo(0, 100); c.closePath(); c.fill();
        break;
    }
  }
  function drawTrophy(x, baseY, s) {
    const g = ctx; g.save(); g.translate(x, baseY); g.scale(s, s);
    g.fillStyle = "#caa63a"; g.fillRect(-26, 0, 52, 10); g.fillRect(-18, -8, 36, 10);
    g.strokeStyle = "#e9c85a"; g.lineWidth = 2;
    for (let i = -5; i <= 5; i++) {
      const px = i * 5;
      g.beginPath(); g.moveTo(px, -8); g.lineTo(px, -52); g.stroke();
      g.fillStyle = i % 2 ? "#ce1141" : "#13274f";
      g.beginPath(); g.moveTo(px, -52); g.lineTo(px + 6, -48); g.lineTo(px, -44); g.closePath(); g.fill();
    }
    g.fillStyle = "#f2d24b"; g.beginPath(); g.arc(0, -58, 8, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#b8901f"; g.lineWidth = 1; g.stroke();
    g.restore();
  }
  function drawCelebration(dt) {
    winTimer += dt;
    drawSky(); if (!LEVELS[levelIdx].night) drawClouds(); drawPark(); drawGround(groundOffset);
    for (const p of confetti) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > GROUND_Y + 12) { p.y = -8; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore();
    }
    drawTrophy(W * 0.62, 150, 1 + Math.sin(winTimer * 0.1) * 0.04);
    const hop = Math.abs(Math.sin(winTimer * 0.22)) * 22;
    player.runFrame += 0.35 * dt;
    drawRunner(ctx, player.x + 10, GROUND_Y - hop, ROSTER[charIndex], { duck: false, onGround: true, runFrame: player.runFrame, party: true });
    const pulse = 1 + Math.sin(winTimer * 0.2) * 0.06;
    ctx.save(); ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.font = "bold " + Math.round(30 * pulse) + "px Arial";
    ctx.strokeText("WORLD SERIES CHAMPS!", W / 2, 46);
    ctx.fillStyle = "#ffd23f"; ctx.fillText("WORLD SERIES CHAMPS!", W / 2, 46);
    ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.font = "bold 14px Arial";
    ctx.fillText(ROSTER[charIndex].name + "  •  " + LEVELS[LEVELS.length - 1].team + "  •  Score " + Math.floor(score), W / 2, 68);
    ctx.restore();
  }

  function drawHUD() {
    const L = LEVELS[levelIdx], night = L.night;
    const ink = night ? "rgba(255,255,255,0.96)" : "#12233b";
    const inkDim = night ? "rgba(255,255,255,0.72)" : "rgba(27,42,66,0.72)";
    const bd = BADGE[L.team] || ["#333", "?"];
    // left: big inning header + team badge on a backing pill
    ctx.save();
    ctx.fillStyle = night ? "rgba(0,0,0,0.32)" : "rgba(255,255,255,0.5)";
    roundRect(ctx, 10, 8, 176, 46, 10); ctx.fill();
    ctx.fillStyle = bd[0]; ctx.beginPath(); ctx.arc(35, 31, 18, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(bd[1], 35, 31);
    ctx.fillStyle = ink; ctx.textAlign = "left"; ctx.font = "900 36px Arial";
    ctx.fillText(String(levelIdx + 1), 62, 33);
    ctx.fillStyle = inkDim; ctx.textBaseline = "alphabetic"; ctx.font = "bold 9px Arial";
    ctx.fillText(ORD[levelIdx] + " INNING", 90, 26);
    ctx.fillText(L.name, 90, 38);
    ctx.restore();
    // right: score + high
    ctx.fillStyle = ink; ctx.font = "bold 18px 'Courier New', monospace"; ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillText(String(Math.floor(score)).padStart(5, "0"), W - 14, 12);
    ctx.fillStyle = inkDim; ctx.font = "bold 12px 'Courier New', monospace";
    ctx.fillText("HI " + String(Math.floor(high)).padStart(5, "0"), W - 14, 33);
    // player tag (tiny, bottom-left)
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = inkDim; ctx.font = "bold 10px Arial";
    ctx.fillText(ROSTER[charIndex].name + " · " + diffKey.toUpperCase() + " · V" + version + (muted ? " · 🔇" : ""), 12, H - 8);
  }

  // ======================= COLLISION ======================================
  function playerBox() {
    if (player.ducking) return { x: player.x - 16, y: player.y - 26, w: 46, h: 26 };
    return { x: player.x - 10, y: player.y - 46, w: 22, h: 46 };
  }
  function obBox(o) {
    const pad = 3;
    return { x: o.x - o.w / 2 + pad, y: o.baseY - o.h + pad + (o.bobY || 0), w: o.w - pad * 2, h: o.h - pad };
  }
  function hit(a, o) {
    const b = obBox(o);
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ======================= LOOP ===========================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H);

    if (state === S.WIN) { drawCelebration(dt); requestAnimationFrame(frame); return; }

    if (state === S.PLAYING) {
      if (celebrating) {
        // brief between-level celebration: everything freezes, player hops & roars
        celebrateTimer -= dt; player.runFrame += 0.3 * dt;
        if (celebrateTimer <= 0) celebrating = false;
      } else {
        speed = Math.min(effMax(), speed + cfg.accel * dt);
        distance += speed * dt;
        const newScore = Math.floor(distance / 6);
        if (Math.floor(newScore / 100) > Math.floor(score / 100)) { flashMilestone = 22; if (!richSound()) beep(880, 0.12, "sine", 0.06); }
        score = newScore;

        // level progression
        if (levelIdx < LEVELS.length - 1 && score >= LEVELS[levelIdx].target) { levelIdx++; onLevelUp(); }
        else if (levelIdx === LEVELS.length - 1 && !champShown && score >= LEVELS[levelIdx].target) { champShown = true; onChamp(); }

        // gravity — holding jump while rising floats you higher (clear 2 in a row)
        let gg = GRAVITY;
        if (jumpHeld && player.vy < 0 && jumpHoldFrames < 13) { gg *= 0.60; jumpHoldFrames += dt; }
        player.vy += gg * dt; player.y += player.vy * dt;
        if (player.y >= GROUND_Y) { player.y = GROUND_Y; player.vy = 0; player.onGround = true; }

        // stride cadence: scales gently with speed, capped so it never flickers
        if (player.onGround) player.runFrame += Math.min(0.30, 0.045 * speed) * dt;

        spawnGap -= speed * dt;
        if (spawnGap <= 0) spawnObstacle();

        for (const o of obstacles) {
          o.x -= speed * dt;
          if (o.type === "ball" && o.amp) { o.bob += 0.12 * dt; o.bobY = Math.sin(o.bob) * o.amp; }
        }
        obstacles = obstacles.filter(o => o.x > -70);
        groundOffset += speed * dt;

        const pb = playerBox();
        for (const o of obstacles) {
          if (hit(pb, o)) {
            state = S.OVER; if (richSound()) groan(); else beep(140, 0.3, "sawtooth", 0.06);
            if (score > high) { high = score; localStorage.setItem("mlbHigh", String(high)); }
            goTitle.textContent = ROSTER[charIndex].name.split(" ")[0] + " struck out!";
            goScore.textContent = "Score " + Math.floor(score) + "  ·  High " + Math.floor(high);
            gameoverEl.classList.remove("hidden");
            break;
          }
        }
      }
    }

    for (const c of clouds) { c.x -= c.s * (state === S.PLAYING ? speed : 1) * 0.25 * dt; if (c.x < -40) { c.x = W + 40; c.y = 20 + Math.random() * 70; } }

    drawSky();
    if (!LEVELS[levelIdx].night) drawClouds();
    drawPark();
    drawGround(groundOffset);
    for (const o of obstacles) drawObstacle(o);
    if (state !== S.MENU) {
      let feetY = player.y, cheer = false;
      if (celebrating) { feetY = GROUND_Y - Math.abs(Math.sin(celebrateTimer * 0.35)) * 16; cheer = true; }
      drawRunner(ctx, player.x, feetY, ROSTER[charIndex],
        { duck: player.ducking, onGround: player.onGround, runFrame: player.runFrame, cheer });
      drawHUD();
    }

    if (flashMilestone > 0) {
      ctx.globalAlpha = flashMilestone / 22; ctx.fillStyle = "#ce1141";
      ctx.textAlign = "center"; ctx.font = "bold 20px Arial"; ctx.fillText("+100!", W / 2, 44);
      ctx.globalAlpha = 1; flashMilestone -= dt;
    }

    if (levelFlash > 0) {
      const a = Math.min(1, levelFlash / 32);
      ctx.globalAlpha = a;
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(206,17,65,0.95)"; ctx.font = "bold 30px Arial";
      const isChamp = champShown && levelIdx === LEVELS.length - 1 && levelFlashName.indexOf("CHAMP") >= 0;
      ctx.fillText(isChamp ? levelFlashName : "LEVEL " + (levelIdx + 1), W / 2, H / 2 - 6);
      if (!isChamp) { ctx.font = "bold 16px Arial"; ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fillText(levelFlashName, W / 2, H / 2 + 18); }
      ctx.globalAlpha = 1; levelFlash -= dt;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ======================= MENU UI ========================================
  const menuEl = document.getElementById("menu");
  const gameoverEl = document.getElementById("gameover");
  const winEl = document.getElementById("win");
  const goTitle = document.getElementById("goTitle");
  const goScore = document.getElementById("goScore");
  const preview = document.getElementById("preview");
  const pctx = preview.getContext("2d");
  const pname = document.getElementById("pname");
  const pteam = document.getElementById("pteam");

  function renderPreview() {
    const ch = ROSTER[charIndex];
    pname.textContent = ch.name;
    pteam.textContent = ch.team + " · #" + ch.num;
    localStorage.setItem("mlbChar", String(charIndex));
  }
  let previewFrame = 0;
  function animatePreview() {
    pctx.clearRect(0, 0, preview.width, preview.height);
    // little ground
    pctx.fillStyle = "#4b8b3b"; pctx.fillRect(0, 108, preview.width, 20);
    previewFrame += 0.14;
    drawRunner(pctx, 75, 106, ROSTER[charIndex],
      { duck: false, onGround: true, runFrame: previewFrame });
    requestAnimationFrame(animatePreview);
  }
  animatePreview();

  function changeChar(dir) {
    charIndex = (charIndex + dir + ROSTER.length) % ROSTER.length;
    renderPreview(); beep(440, 0.05, "square", 0.03);
  }
  function setDiff(k) {
    diffKey = k; localStorage.setItem("mlbDiff", k);
    document.querySelectorAll("#diff .diffbtn").forEach(b => b.classList.toggle("active", b.dataset.diff === k));
  }
  function setVersion(v) {
    version = v; localStorage.setItem("mlbVer", String(v));
    document.querySelectorAll("#ver .diffbtn").forEach(b => b.classList.toggle("active", Number(b.dataset.ver) === v));
  }
  function toMenu() {
    state = S.MENU; obstacles = []; levelIdx = 0; stopCrowd(); stopWinMusic();
    gameoverEl.classList.add("hidden"); winEl.classList.add("hidden"); menuEl.classList.remove("hidden");
  }

  document.getElementById("prev").onclick = () => changeChar(-1);
  document.getElementById("next").onclick = () => changeChar(1);
  document.getElementById("playBtn").onclick = startGame;
  document.getElementById("againBtn").onclick = startGame;
  document.getElementById("menuBtn").onclick = toMenu;
  document.getElementById("winAgain").onclick = startGame;
  document.getElementById("winMenu").onclick = toMenu;
  document.getElementById("surprise").onclick = () => { charIndex = (Math.random() * ROSTER.length) | 0; renderPreview(); beep(700, 0.08, "sine", 0.05); };
  document.querySelectorAll("#diff .diffbtn").forEach(b => b.onclick = () => setDiff(b.dataset.diff));
  document.querySelectorAll("#ver .diffbtn").forEach(b => b.onclick = () => setVersion(Number(b.dataset.ver)));

  setDiff(diffKey);
  setVersion(version);
  renderPreview();
})();
</script>
</body>
</html>
